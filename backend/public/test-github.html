<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub API 测试</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #23ADE5;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #FF6B00;
        }

        .test-section {
            background: #1a1a1a;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #FF6B00;
        }

        button {
            background: #FF6B00;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #ff8533;
        }

        pre {
            background: #000;
            padding: 10px;
            overflow-x: auto;
            border-left: 3px solid #23ADE5;
        }

        .error {
            color: #ff4d4f;
        }

        .success {
            color: #52c41a;
        }
    </style>
</head>

<body>
    <h1>GitHub API 调试工具</h1>

    <div class="test-section">
        <h2>1. 测试配置状态</h2>
        <button onclick="testSetupStatus()">检查初始化状态</button>
        <pre id="setup-result"></pre>
    </div>

    <div class="test-section">
        <h2>2. 测试 GitHub 用户信息</h2>
        <button onclick="testGithubUser()">获取用户信息</button>
        <pre id="user-result"></pre>
    </div>

    <div class="test-section">
        <h2>3. 测试 GitHub Events</h2>
        <input type="text" id="username-input" placeholder="输入 GitHub 用户名" style="padding: 8px; width: 200px;">
        <button onclick="testGithubEvents()">获取活动数据</button>
        <pre id="events-result"></pre>
    </div>

    <div class="test-section">
        <h2>4. 直接调用 GitHub API (测试跨域)</h2>
        <input type="text" id="direct-username-input" placeholder="输入 GitHub 用户名" style="padding: 8px; width: 200px;">
        <button onclick="testDirectGithubAPI()">直接调用</button>
        <pre id="direct-result"></pre>
    </div>

    <script>
        const API_URL = 'http://localhost:3001';

        async function testSetupStatus() {
            const result = document.getElementById('setup-result');
            result.innerHTML = '正在检查...';

            try {
                const response = await fetch(`${API_URL}/api/setup/status`);
                const data = await response.json();
                result.innerHTML = `<span class="success">✓ 成功</span>\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                result.innerHTML = `<span class="error">✗ 失败</span>\n${error.message}`;
            }
        }

        async function testGithubUser() {
            const result = document.getElementById('user-result');
            result.innerHTML = '正在获取...';

            try {
                const response = await fetch(`${API_URL}/api/github/user`);
                const data = await response.json();
                result.innerHTML = `<span class="success">✓ 成功</span>\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                result.innerHTML = `<span class="error">✗ 失败</span>\n${error.message}`;
            }
        }

        async function testGithubEvents() {
            const result = document.getElementById('events-result');
            const username = document.getElementById('username-input').value || 'bwwq';
            result.innerHTML = '正在获取...';

            try {
                const response = await fetch(`${API_URL}/api/github/events/${username}`);
                const data = await response.json();
                result.innerHTML = `<span class="success">✓ 成功 (${data.length} 条事件)</span>\n${JSON.stringify(data.slice(0, 3), null, 2)}\n...`;
            } catch (error) {
                result.innerHTML = `<span class="error">✗ 失败</span>\n${error.message}`;
            }
        }

        async function testDirectGithubAPI() {
            const result = document.getElementById('direct-result');
            const username = document.getElementById('direct-username-input').value || 'bwwq';
            result.innerHTML = '正在调用...';

            try {
                const response = await fetch(`https://api.github.com/users/${username}`);
                const data = await response.json();
                result.innerHTML = `<span class="success">✓ 成功 (直接调用成功)</span>\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                result.innerHTML = `<span class="error">✗ 失败 (可能是跨域限制)</span>\n${error.message}`;
            }
        }
    </script>
</body>

</html>
